name: Publish Climate UI release
on:
  workflow_run:
    workflows: ["Verify Climate UI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.5 after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.5 already exists."
            exit 0
          fi
          gh release create v0.2.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Franky's Climate UI v0.2.5" \
            --notes "Fix AUTO on simple heat/off thermostats: heat now correctly means native automatic setpoint regulation, MANUELL is disabled without an explicit manual mode, and helper-based or native three-mode controls remain unchanged. The schedule editor remains unchanged and still requires a separate HA automation for timed control."
