name: Publish Climate UI release
on:
  workflow_run:
    workflows: ["Verify Climate UI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.6 after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.6 already exists."
            exit 0
          fi
          gh release create v0.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Franky's Climate UI v0.2.6" \
            --notes "Restore Climate Card v0.2.8 control compatibility while preserving the new UI: native thermostat heat means AUTO; restore configured profiles, manual heater control, OFF scripts and helper actions. Restore explicit heating schedule creation and resolve existing schedules through entity registry IDs. Target temperature handling and visual design remain unchanged. Syntax, functional regression and HACS checks passed before publication. No automatic Home Assistant installation; timed schedule execution still requires an existing automation."
