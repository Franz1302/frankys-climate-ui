name: Publish first Climate UI release
on:
  workflow_run:
    workflows: ["Verify Climate UI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.1 after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists."
            exit 0
          fi
          gh release create v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Franky's Climate UI v0.1.1" \
            --notes "Initial public release of Franky's Climate UI for Home Assistant. JARVIS-style temperature dial, heating flame, 24h chart, DE/EN interface, Celsius/Fahrenheit support, responsive sizing, and native Home Assistant schedule integration."
