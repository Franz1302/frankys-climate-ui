name: Publish Climate UI release
on:
  workflow_run:
    workflows: ["Verify Climate UI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.0 after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists."
            exit 0
          fi
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "Franky's Climate UI v0.2.0" \
            --notes "New 3D glass/neon JARVIS interface with adaptive thermostat scale and 12-hour Recorder temperature history. Existing Home Assistant card type, entity settings, mode/schedule actions and HACS installation remain the same."
